name: _ build authorizer lambda and apply terraform

on:
  workflow_call:
    inputs:
      tfstate_bucket:
        description: "Name of the S3 bucket to store Terraform state"
        required: true
        type: string
      tfstate_key:
        description: "Key for the authorizer Terraform state in the S3 bucket"
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Build & Deploy Authorizer
    env:
      REUSABLE_SCRIPT_SHA: 5a9b6b0213dfc38272d342fd24b4fdf72567e142
      REUSABLE_SCRIPT_PATH: scripts/build-net-aot-lambda-function.sh
    # arm64 runner so the linux/arm64 Native AOT build container runs natively
    # (the build targets linux-arm64 / Graviton). An x64 runner would require
    # QEMU emulation, which makes AOT compilation prohibitively slow.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build & package authorizer Lambda
        run: |
          set -euo pipefail

          SCRIPT_URL="https://raw.githubusercontent.com/OsborneSupremacy/ahzborn-reusable/${REUSABLE_SCRIPT_SHA}/${REUSABLE_SCRIPT_PATH}"
          SCRIPT_FILE="./build-net-aot-lambda-function.sh"

          echo "Using reusable build script commit: ${REUSABLE_SCRIPT_SHA}"

          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "${SCRIPT_URL}" -o "${SCRIPT_FILE}"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO "${SCRIPT_FILE}" "${SCRIPT_URL}"
          else
            echo "error: neither curl nor wget is available on this runner" >&2
            exit 1
          fi

          if [[ ! -s "${SCRIPT_FILE}" ]]; then
            echo "error: failed to download reusable build script from ${SCRIPT_URL}" >&2
            exit 1
          fi

          chmod +x "${SCRIPT_FILE}"

          bash "${SCRIPT_FILE}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --target authorizer \
            --lambda "authorizer|src/Ecommerce/Ecommerce.Authorizer|Authorizer.zip|Ecommerce.Authorizer.csproj"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: iac/authorizer
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.tfstate_bucket }}" \
            -backend-config="key=${{ inputs.tfstate_key }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: iac/authorizer
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac/authorizer
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: iac/authorizer
        run: terraform apply -auto-approve tfplan
