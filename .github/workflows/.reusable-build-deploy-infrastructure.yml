name: _ build lambda functions and apply terraform

on:
  workflow_call:
    inputs:
      tfstate_bucket:
        description: "Name of the S3 bucket to store Terraform state"
        required: true
        type: string
      tfstate_key:
        description: "Key prefix for Terraform state files in the S3 bucket"
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Build & Deploy
    # arm64 runner so the linux/arm64 Native AOT build container runs natively
    # (the build targets linux-arm64 / Graviton). An x64 runner would require
    # QEMU emulation, which makes AOT compilation prohibitively slow.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build & package Lambdas
        # The authorizer Lambda is built and deployed by its own pipeline
        # (deploy-authorizer.yml); this pipeline only needs the order Lambdas.
        uses: OsborneSupremacy/ahzborn-reusable/.github/actions/build-net-aot-lambda@v1.0.1
        with:
          repo-root: ${{ github.workspace }}
          target: orders
          lambda-specs: |
            orders|src/Ecommerce/Ecommerce.Order.Create|CreateOrder.zip|Ecommerce.Order.Create.csproj
            orders|src/Ecommerce/Ecommerce.Order.Get|GetOrder.zip|Ecommerce.Order.Get.csproj
            orders|src/Ecommerce/Ecommerce.Order.Update|UpdateOrder.zip|Ecommerce.Order.Update.csproj
            orders|src/Ecommerce/Ecommerce.Order.Delete|DeleteOrder.zip|Ecommerce.Order.Delete.csproj

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: iac
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.tfstate_bucket }}" \
            -backend-config="key=${{ inputs.tfstate_key }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: iac
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: iac
        run: terraform apply -auto-approve tfplan
